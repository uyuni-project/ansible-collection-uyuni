---
name: Sanity checks

# concurrency:
#  group: ${{ github.head_ref || github.run_id }}
#  cancel-in-progress: true

on:
  # Run CI against all pushes (direct commits, also merged PRs), Pull Requests
  push:
  pull_request:
  # Run CI once per day (at 06:00 UTC)
  # This ensures that even if there haven't been commits that we are still testing against latest version of ansible-test for each ansible-base version
  schedule:
    - cron: '0 6 * * *'

jobs:
  ansible-test:
    runs-on: homelab
    container:
      image: buildpack-deps:trixie
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v6
      - run: pip install ansible
      - run: /root/.local/bin/ansible-galaxy collection build .
      - run: /root/.local/bin/ansible-galaxy collection install -p /tmp stdevel-uyuni*.tar.gz
      - run: cd /tmp/ansible_collections/stdevel/uyuni ; LANG=en_US.UTF-8 /root/.local/bin/ansible-test sanity ; LANG=en_US.UTF-8 /root/.local/bin/ansible-test env
