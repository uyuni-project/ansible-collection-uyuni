---
- name: Include variables
  ansible.builtin.include_vars: "{{ lookup('ansible.builtin.first_found', params) }}"
  vars:
    params:
      files:
        - "{{ ansible_facts['distribution'] | regex_replace(' ', '_') | lower }}-{{ ansible_facts['distribution_major_version'] }}.yml"
        - "{{ ansible_facts['distribution'] | regex_replace(' ', '_') | lower }}-{{ ansible_facts['distribution_version'] }}.yml"
        - "{{ ansible_facts['distribution'] | regex_replace(' ', '_') | lower }}.yml"
        - "{{ ansible_facts['distribution'] | split(' ') | first | lower }}.yml"
        - "{{ ansible_facts['os_family'] | lower }}.yml"
      paths:
        - vars

- name: Include check tasks (generic)
  ansible.builtin.import_tasks: check.yml
  tags: prepare

- name: Include check tasks (distribution-specific)
  ansible.builtin.include_tasks: "{{ lookup('ansible.builtin.first_found', params) }}"
  vars:
    params:
      files:
        - "check_{{ ansible_facts['distribution'] | regex_replace(' ', '_') | lower }}-{{ ansible_facts['distribution_major_version'] }}.yml"
        - "check_{{ ansible_facts['distribution'] | regex_replace(' ', '_') | lower }}-{{ ansible_facts['distribution_version'] }}.yml"
        - "check_{{ ansible_facts['distribution'] | regex_replace(' ', '_') | lower }}.yml"
        - "check_{{ ansible_facts['distribution'] | split(' ') | first | lower }}.yml"
        - "check_{{ ansible_facts['os_family'] | lower }}.yml"
      skip: true
      paths:
        - tasks
  tags: prepare

- name: Include preparation tasks (distribution-specific)
  ansible.builtin.include_tasks: "{{ lookup('ansible.builtin.first_found', params) }}"
  vars:
    params:
      files:
        - "prepare_{{ ansible_facts['distribution'] | regex_replace(' ', '_') | lower }}-{{ ansible_facts['distribution_major_version'] }}.yml"
        - "prepare_{{ ansible_facts['distribution'] | regex_replace(' ', '_') | lower }}-{{ ansible_facts['distribution_version'] }}.yml"
        - "prepare_{{ ansible_facts['distribution'] | regex_replace(' ', '_') | lower }}.yml"
        - "prepare_{{ ansible_facts['distribution'] | split(' ') | first | lower }}.yml"
        - "prepare_{{ ansible_facts['os_family'] | lower }}.yml"
      skip: true
      paths:
        - tasks
  tags: prepare

- name: Include preparation tasks (generic)
  ansible.builtin.include_tasks: "prepare.yml"
  tags: prepare

- name: Include install tasks
  ansible.builtin.import_tasks: install.yml
  tags: install

- name: Include content tasks
  ansible.builtin.import_tasks: content.yml
  tags: content

- name: Include monitoring tasks
  ansible.builtin.include_tasks: monitoring.yml
  tags: monitoring
  when: server_enable_monitoring | bool
