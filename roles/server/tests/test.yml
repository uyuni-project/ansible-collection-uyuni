---
- name: Run role
  hosts: local-vm
  become: true
  pre_tasks:
    - name: Set hostname
      ansible.builtin.hostname:
        name: mlm.local.loc

    - name: Set hostname entry
      ansible.builtin.lineinfile:
        path: /etc/hosts
        search_string: "^{{ ansible_facts['default_ipv4']['address'] }}"
        line: "{{ ansible_facts['default_ipv4']['address'] }} mlm.local.loc mlm"

  roles:
    - role: server
      server_scc_reg_code_mlm: "TODO"
      server_scc_mail: "TODO"
