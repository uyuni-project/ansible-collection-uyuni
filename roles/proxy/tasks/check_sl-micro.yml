---
- name: Ensure having proper architecture
  ansible.builtin.fail:
    msg: "SUSE MLM Proxy only supports x86_64 and aarch64 for SLE/SL Micro"
  when:
    - ansible_facts['architecture'] not in ['x86_64', 'aarch64']

- name: Ensure having SUSE MLM release equal/greater than 5.1
  ansible.builtin.fail:
    msg: "SUSE MLM releases older than 5.1 are unsupported"
  when:
    - proxy_suma_release is defined
    - "proxy_suma_release is version('5.1', '<')"

- name: Ensure having supported SL Micro release for SUSE MLM 5.1
  ansible.builtin.fail:
    msg: "Please upgrade to SL Micro 6.1"
  when:
    - proxy_suma_release == 5.1
    - ansible_facts['distribution_version'] != '6.1'
