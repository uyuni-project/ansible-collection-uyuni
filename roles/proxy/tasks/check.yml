---
- name: Check distribution
  ansible.builtin.fail:
    msg: "Unsupported distribution detected. Set proxy_allow_unsupported_distributions if you wan't to proceed."
  when:
    - ansible_facts['os_family'] | lower != "suse"
    - not proxy_allow_unsupported_distributions

- name: Ensure not installing SUSE Multi-Linux Manager
  ansible.builtin.fail:
    msg: "SUSE Multi-Linux Manager is not supported on non-SUSE distributions"
  when:
    - proxy_scc_reg_code_mlm is defined
    - proxy_scc_reg_code_os is defined
    - ansible_facts['os_family'] | lower != "suse"

- name: Ensure having Uyuni release equal/greater than 2024.03
  ansible.builtin.fail:
    msg: "Uyuni releases older than 2024.03 are unsupported - use an older version of this collection"
  when:
    - proxy_uyuni_release is defined
    - "proxy_uyuni_release is version('2024.03', '<=')"

- name: Check CPU
  ansible.builtin.fail:
    msg: "Please ensure having at least 2 CPUs"
  when:
    - ansible_facts['processor_vcpus'] < 2
    - proxy_check_requirements

- name: Check memory
  ansible.builtin.fail:
    msg: "Please ensure having at least 8 GB of memory"
  when:
    - ansible_facts['memtotal_mb'] < 7900
    - proxy_check_requirements
