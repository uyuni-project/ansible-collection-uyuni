---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
driver:
  options:
    managed: false
    login_cmd_template: "podman exec -ti {instance} bash"
    ansible_connection_options:
      ansible_connection: podman
lint: |
  yamllint .
  ansible-lint
  flake8
platforms:
  - name: almalinux
    image: almalinux9-uyuni
    privileged: true
    command: /sbin/init
verifier:
  name: testinfra
  directory: ../default/tests
